
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="サクメモ - 農場の栽培記録">
<meta name="robots" content="index, follow">
<title>サクメモ - 農場ページ</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Sans','BIZ UDGothic',sans-serif;background:#f8f5ef;color:#1c1a14;min-height:100svh;}
.top-bar{background:linear-gradient(135deg,#2d6a3f,#419857);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200;}
.top-bar a{color:#fff;text-decoration:none;font-size:.84rem;font-weight:700;white-space:nowrap;}
.farm-header{max-width:680px;margin:0 auto;padding:14px 14px 6px;}
.farm-title{font-family:'Shippori Mincho B1',serif;font-size:1.3rem;margin-bottom:3px;}
.farm-desc{font-size:.78rem;color:#888;}

/* カテゴリ一覧 */
.cat-wrap{max-width:680px;margin:0 auto;padding:10px 14px;}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.cat-card{background:#fff;border-radius:12px;padding:14px 12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.07);transition:transform .1s,box-shadow .1s;text-align:center;}
.cat-card:active{transform:scale(.97);}
.cat-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.12);}
.cat-emoji{font-size:2rem;margin-bottom:6px;}
.cat-name{font-size:.84rem;font-weight:700;color:#1c1a14;}
.cat-count{font-size:.68rem;color:#888;margin-top:3px;}

/* 品種リスト */
.variety-wrap{max-width:680px;margin:0 auto;padding:10px 14px;}
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:#2d6a3f;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;padding:4px 0;margin-bottom:12px;}
.variety-list{display:flex;flex-direction:column;gap:8px;}
.variety-card{background:#fff;border-radius:12px;padding:14px 16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.07);display:flex;align-items:center;gap:12px;transition:transform .1s;}
.variety-card:active{transform:scale(.98);}
.variety-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.12);}
.variety-emoji{font-size:1.8rem;}
.variety-info{flex:1;}
.variety-name{font-size:.9rem;font-weight:700;}
.variety-sub{font-size:.72rem;color:#888;margin-top:2px;}
.variety-arrow{color:#ccc;font-size:1.1rem;}

/* 品目詳細 */
.main{max-width:680px;margin:0 auto;padding:12px 14px 60px;}
.crop-hero{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.07);}
.crop-hero-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;}
.crop-emoji{font-size:2.2rem;}
.crop-title{font-family:'Shippori Mincho B1',serif;font-size:1rem;font-weight:700;}
.crop-sub{font-size:.72rem;color:#888;margin-top:3px;}
.crop-stats{display:flex;gap:8px;margin-top:10px;}
.stat{flex:1;background:#f8f5ef;border-radius:9px;padding:7px 4px;text-align:center;}
.stat-n{font-size:1rem;font-weight:700;color:#2d6a3f;}
.stat-l{font-size:.62rem;color:#888;margin-top:1px;}
.progress-bar{height:5px;background:#e0d9ce;border-radius:999px;margin:8px 0 3px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#2d6a3f,#52b788);border-radius:999px;}
.progress-label{display:flex;justify-content:space-between;font-size:.68rem;color:#888;}
.meta-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid #e0d9ce;}
.view-count{font-size:.7rem;color:#aaa;}
.fav-btn{background:none;border:1.5px solid #e0d9ce;border-radius:999px;padding:4px 12px;font-size:.72rem;cursor:pointer;font-family:inherit;color:#888;transition:all .15s;}
.fav-btn.on{background:#fff9f0;border-color:#f0a500;color:#f0a500;}

/* タイムライン（インスタ風） */
.timeline{display:flex;flex-direction:column;gap:10px;}
.log-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.08);}
.log-photos{display:grid;gap:2px;}
.log-photos.p1 img{width:100%;max-height:280px;object-fit:cover;}
.log-photos.p2{grid-template-columns:1fr 1fr;}
.log-photos.p2 img{width:100%;height:160px;object-fit:cover;}
.log-photos.p3{grid-template-columns:1fr 1fr 1fr;}
.log-photos.p3 img{width:100%;height:120px;object-fit:cover;}
.log-body{padding:12px 14px;}
.log-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.wt{padding:2px 8px;border-radius:999px;font-size:.68rem;font-weight:700;}
.sow{background:#dcfce7;color:#166534;}
.transplant{background:#ede9fe;color:#5b21b6;}
.fert{background:#d1fae5;color:#065f46;}
.pest{background:#fef3c7;color:#92400e;}
.harvest{background:#dbeafe;color:#1e40af;}
.other{background:#f3f4f6;color:#374151;}
.log-date{font-size:.68rem;color:#aaa;margin-left:auto;}
.log-crop-tag{font-size:.68rem;background:#f0f9f0;color:#2d6a3f;border-radius:999px;padding:2px 8px;}
.log-detail{font-size:.78rem;font-weight:600;margin-bottom:3px;}
.log-memo{font-size:.78rem;color:#5a5040;line-height:1.6;}
.hv-box{display:flex;gap:10px;margin-top:7px;background:#f0f9f4;border-radius:8px;padding:7px 10px;}
.hv-n{font-size:.95rem;font-weight:700;color:#2d6a3f;}
.hv-l{font-size:.62rem;color:#888;margin-top:1px;}
.empty{text-align:center;padding:48px 20px;color:#aaa;}
.empty-icon{font-size:2.2rem;margin-bottom:10px;}
.loading{text-align:center;padding:48px;color:#aaa;}

/* タブ（カテゴリ内） */
.tab-mode-bar{background:#fff;border-bottom:2px solid #e0d9ce;position:sticky;top:44px;z-index:199;}
.tab-mode-inner{max-width:680px;margin:0 auto;display:flex;}
.tab-mode-btn{flex:1;padding:10px;border:none;background:none;font-family:inherit;font-size:.78rem;color:#888;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab-mode-btn.active{color:#2d6a3f;border-bottom-color:#2d6a3f;font-weight:700;}

.report-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center;}
.report-modal.open{display:flex;}
.report-box{background:#fff;border-radius:16px;padding:24px;max-width:360px;width:90%;}
</style>
</head>
<body>
<div class="top-bar">
  <a href="community.html">← みんなのサクメモ</a>
</div>
<div id="farm-header-wrap"></div>

<!-- モード: categories / varieties / crop-detail / timeline -->
<div id="view-categories" style="display:none">
  <div class="tab-mode-bar" id="tab-mode-bar">
    <div class="tab-mode-inner">
      <button class="tab-mode-btn active" id="btn-by-crop" onclick="switchMode('categories')">🌱 品目別</button>
      <button class="tab-mode-btn" id="btn-timeline" onclick="switchMode('timeline')">📋 タイムライン</button>
    </div>
  </div>
  <div class="cat-wrap">
    <div class="cat-grid" id="cat-grid"></div>
  </div>
</div>

<div id="view-varieties" style="display:none">
  <div class="variety-wrap">
    <button class="back-btn" onclick="showCategories()">← 品目一覧に戻る</button>
    <div class="variety-list" id="variety-list"></div>
  </div>
</div>

<div id="view-crop" style="display:none">
  <div class="main" id="crop-main"></div>
</div>

<div id="view-timeline" style="display:none">
  <div class="tab-mode-bar">
    <div class="tab-mode-inner">
      <button class="tab-mode-btn" id="btn-by-crop2" onclick="switchMode('categories')">🌱 品目別</button>
      <button class="tab-mode-btn active" id="btn-timeline2" onclick="switchMode('timeline')">📋 タイムライン</button>
    </div>
  </div>
  <div class="main" id="timeline-main"></div>
</div>

<div class="report-modal" id="report-modal">
  <div class="report-box">
    <h3 style="color:#dc2626;margin-bottom:10px">⚠️ 不適切なコンテンツを報告</h3>
    <p style="font-size:.78rem;color:#666;margin-bottom:10px">報告内容は管理者が確認します。</p>
    <select id="report-reason" style="width:100%;padding:8px;border:1.5px solid #e0d9ce;border-radius:8px;font-size:.82rem;margin-bottom:10px;font-family:inherit;">
      <option value="inappropriate">不適切な画像・内容</option>
      <option value="spam">スパム・広告</option>
      <option value="privacy">プライバシー侵害</option>
      <option value="other">その他</option>
    </select>
    <textarea id="report-detail" placeholder="詳細（任意）" rows="3" style="width:100%;padding:8px;border:1.5px solid #e0d9ce;border-radius:8px;font-size:.82rem;margin-bottom:12px;font-family:inherit;resize:none;"></textarea>
    <button onclick="submitReport()" style="background:#dc2626;color:#fff;border:none;border-radius:8px;padding:8px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;width:100%;">報告する</button>
    <button onclick="closeReport()" style="background:none;border:1.5px solid #e0d9ce;border-radius:8px;padding:8px;font-size:.82rem;cursor:pointer;font-family:inherit;width:100%;margin-top:6px;">キャンセル</button>
  </div>
</div>

<script>
var SB_URL='https://nlamtphkwdoxtjktkjzo.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5sYW10cGhrd2RveHRqa3RranpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3ODI3NzYsImV4cCI6MjA5MzM1ODc3Nn0.8gba30xxu0s132vg_xOA6-Y3XWjR1YhaprIgUYHZO0o';

var CDB={
  tomato:{n:'トマト',e:'🍅',d:90,cat:'夏野菜'},cherry_tomato:{n:'ミニトマト',e:'🍅',d:75,cat:'夏野菜'},
  cucumber:{n:'キュウリ',e:'🥒',d:55,cat:'夏野菜'},eggplant:{n:'ナス',e:'🍆',d:75,cat:'夏野菜'},
  pepper:{n:'ピーマン',e:'🫑',d:70,cat:'夏野菜'},bitter_gourd:{n:'ゴーヤ',e:'🌿',d:60,cat:'夏野菜'},
  pumpkin:{n:'カボチャ',e:'🎃',d:100,cat:'夏野菜'},watermelon:{n:'スイカ',e:'🍉',d:85,cat:'夏野菜'},
  sweet_corn:{n:'トウモロコシ',e:'🌽',d:80,cat:'夏野菜'},zucchini:{n:'ズッキーニ',e:'🥒',d:55,cat:'夏野菜'},
  edamame:{n:'枝豆',e:'🫘',d:70,cat:'豆類'},green_bean:{n:'インゲン',e:'🫘',d:55,cat:'豆類'},
  azuki:{n:'小豆',e:'🫘',d:100,cat:'豆類'},
  lettuce:{n:'レタス',e:'🥬',d:55,cat:'葉物野菜'},spinach:{n:'ほうれん草',e:'🌿',d:40,cat:'葉物野菜'},
  komatsuna:{n:'小松菜',e:'🥬',d:35,cat:'葉物野菜'},hakusai:{n:'白菜',e:'🥬',d:90,cat:'葉物野菜'},
  cabbage:{n:'キャベツ',e:'🥬',d:90,cat:'葉物野菜'},broccoli:{n:'ブロッコリー',e:'🥦',d:90,cat:'葉物野菜'},
  carrot:{n:'ニンジン',e:'🥕',d:100,cat:'根菜'},radish:{n:'ダイコン',e:'🌰',d:60,cat:'根菜'},
  okra:{n:'オクラ',e:'🌿',d:60,cat:'夏野菜'},
  potato:{n:'ジャガイモ',e:'🥔',d:90,cat:'根菜'},sweetpotato:{n:'サツマイモ',e:'🍠',d:120,cat:'根菜'},
  taro:{n:'里芋',e:'🥔',d:150,cat:'根菜'},jinenjo:{n:'自然薯',e:'🌿',d:210,cat:'根菜'},
  onion:{n:'タマネギ',e:'🧅',d:210,cat:'根菜'},leek:{n:'ネギ',e:'🌿',d:100,cat:'根菜'},
  garlic:{n:'ニンニク',e:'🧄',d:240,cat:'根菜'},strawberry:{n:'イチゴ',e:'🍓',d:180,cat:'果物'},
  rice:{n:'水稲',e:'🌾',d:150,cat:'穀物'},wheat:{n:'麦',e:'🌾',d:240,cat:'穀物'},soba:{n:'そば',e:'🌿',d:75,cat:'穀物'},
  apple:{n:'リンゴ',e:'🍎',d:150,cat:'果樹',fruit:true},pear:{n:'ナシ',e:'🍐',d:140,cat:'果樹',fruit:true},
  peach:{n:'モモ',e:'🍑',d:100,cat:'果樹',fruit:true},cherry:{n:'サクランボ',e:'🍒',d:50,cat:'果樹',fruit:true},
  plum:{n:'ウメ',e:'🌸',d:90,cat:'果樹',fruit:true},mikan:{n:'ミカン',e:'🍊',d:180,cat:'果樹',fruit:true},
  lemon:{n:'レモン',e:'🍋',d:180,cat:'果樹',fruit:true},yuzu:{n:'ユズ',e:'🍋',d:180,cat:'果樹',fruit:true},
  grape:{n:'ブドウ',e:'🍇',d:120,cat:'果樹',fruit:true},persimmon:{n:'カキ',e:'🧡',d:180,cat:'果樹',fruit:true},
  blueberry:{n:'ブルーベリー',e:'🫐',d:60,cat:'果樹',fruit:true},fig:{n:'イチジク',e:'🍈',d:90,cat:'果樹',fruit:true},
  kiwi:{n:'キウイ',e:'🥝',d:180,cat:'果樹',fruit:true},biwa:{n:'ビワ',e:'🍊',d:150,cat:'果樹',fruit:true},
  custom:{n:'その他',e:'🌱',d:90,cat:'その他'}
};

var WORK={
  sow:{l:'播種',cls:'sow'},germinated:{l:'発芽確認',cls:'sow'},
  transplant:{l:'定植',cls:'transplant'},water:{l:'水やり',cls:'other'},
  fert:{l:'施肥',cls:'fert'},pest:{l:'防除',cls:'pest'},
  pruning:{l:'剪定',cls:'other'},thinning:{l:'摘果・摘花',cls:'other'},
  sideshot:{l:'脇芽かき',cls:'other'},repot:{l:'植え替え',cls:'transplant'},
  event:{l:'生育記録',cls:'other'},harvest:{l:'収穫',cls:'harvest'},
  discard:{l:'廃棄',cls:'other'},equip:{l:'資材作業',cls:'other'},
  check:{l:'見回り',cls:'other'},other:{l:'その他',cls:'other'}
};

var allCrops=[],allLogs=[],currentCropId=null,currentMode='categories';

function api(t,p){
  return fetch(SB_URL+'/rest/v1/'+t+'?'+p,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}}).then(function(r){return r.json();});
}
function daysSince(d){return d?Math.floor((Date.now()-new Date(d))/86400000):0;}
function fmtDate(d){if(!d)return'';var dt=new Date(d);return(dt.getMonth()+1)+'/'+dt.getDate();}
function cropName(c){var db=CDB[c.type]||{};return c.type==='custom'?(c.custom_name||'その他'):(db.n||c.type);}
function cropEmoji(c){return(CDB[c.type]||{}).e||'🌱';}

// お気に入り
function getFavs(){try{return JSON.parse(localStorage.getItem('sakumemo_crop_favs')||'[]');}catch{return[];}}
function isFav(id){return getFavs().indexOf(id)>=0;}
function toggleFav(cropId){
  var fs=getFavs(),fi=fs.indexOf(cropId);
  if(fi>=0)fs.splice(fi,1);else fs.push(cropId);
  localStorage.setItem('sakumemo_crop_favs',JSON.stringify(fs));
  var btn=document.getElementById('crop-fav-btn');
  if(btn){var on=isFav(cropId);btn.textContent=on?'⭐ お気に入り':'☆ お気に入り';btn.className='fav-btn'+(on?' on':'');}
}

function switchMode(mode){
  document.getElementById('view-categories').style.display='none';
  document.getElementById('view-varieties').style.display='none';
  document.getElementById('view-crop').style.display='none';
  document.getElementById('view-timeline').style.display='none';

  currentMode=mode;
  if(mode==='categories'){
    document.getElementById('view-categories').style.display='';
    document.getElementById('btn-by-crop').className='tab-mode-btn active';
    document.getElementById('btn-timeline').className='tab-mode-btn';
    renderCategories();
  } else if(mode==='timeline'){
    document.getElementById('view-timeline').style.display='';
    document.getElementById('btn-by-crop2').className='tab-mode-btn';
    document.getElementById('btn-timeline2').className='tab-mode-btn active';
    renderTimeline();
  }
}

function showCategories(){
  document.getElementById('view-varieties').style.display='none';
  document.getElementById('view-categories').style.display='';
}

function showVarieties(typeName){
  // このtype/categoryの品目一覧を表示
  var crops=allCrops.filter(function(c){
    var db=CDB[c.type]||{};
    return (db.n||c.type)===typeName || c.type===typeName ||
           (c.type==='custom'&&c.custom_name&&c.custom_name===typeName);
  });
  if(crops.length===1){
    // 1品目だけなら直接詳細へ
    switchMode('categories');
    document.getElementById('view-categories').style.display='none';
    showCropDetail(crops[0].id);
    return;
  }

  var list=document.getElementById('variety-list');
  list.innerHTML=crops.map(function(c){
    var db=CDB[c.type]||{};
    var name=c.type==='custom'?(c.custom_name||'その他'):(db.n||c.type);
    var variety=c.variety?'（'+c.variety+'）':'';
    var logs=allLogs.filter(function(l){return l.crop_id===c.id;});
    var lastLog=logs.sort(function(a,b){return(b.date||'')>(a.date||'')?1:-1;})[0];
    var sub=c.plant_date?('定植: '+fmtDate(c.plant_date)):(c.sow_date?'播種: '+fmtDate(c.sow_date):'');
    return '<div class="variety-card" onclick="showCropDetailFromVariety(\''+c.id+'\')">'
      +'<span class="variety-emoji">'+(db.e||'🌱')+'</span>'
      +'<div class="variety-info">'
      +'<div class="variety-name">'+name+variety+(c.ended?'<span style="font-size:.65rem;color:#e67e22;margin-left:6px">栽培終了</span>':'')+' </div>'
      +(sub?'<div class="variety-sub">'+sub+(lastLog?' · 最終記録: '+fmtDate(lastLog.date):'')+'</div>':'')
      +'</div>'
      +'<span class="variety-arrow">›</span>'
      +'</div>';
  }).join('');

  document.getElementById('view-categories').style.display='none';
  document.getElementById('view-varieties').style.display='';
}

function showCropDetailFromVariety(cropId){
  document.getElementById('view-varieties').style.display='none';
  showCropDetail(cropId);
}

function renderCategories(){
  // 品目をtype別にグループ化
  var groups={};
  allCrops.forEach(function(c){
    var db=CDB[c.type]||{};
    var key=c.type==='custom'?(c.custom_name||'その他'):(db.n||c.type);
    if(!groups[key])groups[key]={type:c.type,db:db,crops:[],key:key};
    groups[key].crops.push(c);
  });

  var grid=document.getElementById('cat-grid');
  grid.innerHTML=Object.values(groups).map(function(g){
    var logs=allLogs.filter(function(l){
      return g.crops.some(function(c){return c.id===l.crop_id;});
    });
    var lastLog=logs.sort(function(a,b){return(b.date||'')>(a.date||'')?1:-1;})[0];
    return '<div class="cat-card" onclick="showVarieties(\''+g.key+'\')">'
      +'<div class="cat-emoji">'+(g.db.e||'🌱')+'</div>'
      +'<div class="cat-name">'+g.key+'</div>'
      +'<div class="cat-count">'
      +(g.crops.length>1?g.crops.length+'品種 · ':'' )
      +(lastLog?fmtDate(lastLog.date)+'最終記録':'記録なし')
      +'</div>'
      +'</div>';
  }).join('');
  document.getElementById('view-categories').style.display='';
}

function renderTimeline(){
  var el=document.getElementById('timeline-main');
  var logs=[...allLogs].sort(function(a,b){
    return((b.date||'')+(b.time||''))>((a.date||'')+(a.time||''))?1:-1;
  });

  if(!logs.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">📝</div><p>作業記録がまだありません</p></div>';
    return;
  }

  el.innerHTML='<div class="timeline">'+logs.map(function(l){
    return makeTimelineCard(l);
  }).join('')+'</div>';
}

function makeTimelineCard(l){
  var crop=allCrops.find(function(c){return c.id===l.crop_id;})||{};
  var db=CDB[crop.type]||{};
  var w=WORK[l.work]||{l:l.work||'',cls:'other'};
  var detail='';
  if(l.fert_name)detail=l.fert_name+(l.fert_amt?' '+l.fert_amt+(l.fert_unit||''):'');
  if(l.pest_name)detail=l.pest_name+(l.pest_dil?' '+l.pest_dil+'倍':'');
  if(l.event_type)detail=l.event_type+(l.event_note?' · '+l.event_note:'');
  if(l.transplant_qty)detail='定植 '+l.transplant_qty+'株';
  if(l.sow_qty)detail='播種 '+l.sow_qty+'粒';

  var photos=[l.img_src,l.img2_src,l.img3_src].filter(Boolean);
  var photoHtml='';
  if(photos.length){
    var pc='p'+Math.min(photos.length,3);
    photoHtml='<div class="log-photos '+pc+'">'+photos.slice(0,3).map(function(src){
      return '<img src="'+src+'" alt="" loading="lazy">';
    }).join('')+'</div>';
  }

  var hvHtml='';
  if(l.hv_kg||l.hv_cnt){
    hvHtml='<div class="hv-box">';
    if(l.hv_kg)hvHtml+='<div><div class="hv-n">'+l.hv_kg+'kg</div><div class="hv-l">収穫量</div></div>';
    if(l.hv_cnt)hvHtml+='<div><div class="hv-n">'+l.hv_cnt+'個</div><div class="hv-l">個数</div></div>';
    hvHtml+='</div>';
  }

  var cropTag='';
  if(crop.type){
    var cname=crop.type==='custom'?(crop.custom_name||'その他'):(db.n||crop.type);
    if(crop.variety)cname+=' ('+crop.variety+')';
    cropTag='<span class="log-crop-tag" onclick="showCropDetail(\''+crop.id+'\')" style="cursor:pointer">'+( db.e||'🌱')+' '+cname+'</span>';
  }

  return '<div class="log-card">'
    +photoHtml
    +'<div class="log-body">'
    +'<div class="log-meta">'
    +'<span class="wt '+w.cls+'">'+w.l+'</span>'
    +cropTag
    +'<span class="log-date">'+fmtDate(l.date)+'</span>'
    +'</div>'
    +(detail?'<div class="log-detail">'+detail+'</div>':'')
    +(l.memo?'<div class="log-memo">'+l.memo+'</div>':'')
    +hvHtml
    +'</div>'
    +'</div>';
}

function showCropDetail(cropId){
  currentCropId=cropId;
  var crop=allCrops.find(function(c){return c.id===cropId;});
  if(!crop)return;

  var db=CDB[crop.type]||{};
  var name=cropName(crop);
  var emoji=cropEmoji(crop);
  var days=daysSince(crop.plant_date||crop.sow_date);
  var harvestD=db.d||90;
  var pct=Math.min(100,Math.round(days/harvestD*100));
  var isFruitCrop=db.fruit||false;
  var plantYear=crop.plant_date?new Date(crop.plant_date).getFullYear():null;
  var yearsSince=plantYear?new Date().getFullYear()-plantYear+1:null;

  var cropLogs=allLogs.filter(function(l){return l.crop_id===cropId;});
  cropLogs.sort(function(a,b){return((b.date||'')+(b.time||''))>((a.date||'')+(a.time||''))?1:-1;});
  var hvKg=0,hvCnt=0;
  cropLogs.forEach(function(l){hvKg+=parseFloat(l.hv_kg)||0;hvCnt+=parseInt(l.hv_cnt)||0;});

  var subText='';
  if(isFruitCrop&&yearsSince)subText='植付 '+yearsSince+'年目';
  else if(crop.plant_date)subText=(crop.cultivation_type==='direct'?'播種':'定植')+': '+crop.plant_date+' · '+days+'日目';
  else if(crop.sow_date)subText='播種: '+crop.sow_date+' · '+days+'日目';
  if(crop.ended)subText+=(subText?' · ':'')+'栽培終了'+(crop.end_date?' '+crop.end_date:'');

  var progressHtml='';
  if(!crop.ended&&(crop.plant_date||crop.sow_date)&&!isFruitCrop){
    progressHtml='<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div>'
      +'<div class="progress-label"><span>生育進捗 '+pct+'%</span><span>収穫まで約'+Math.max(0,harvestD-days)+'日</span></div>';
  }

  var on=isFav(cropId);
  var logsHtml=cropLogs.length===0
    ?'<div class="empty"><div class="empty-icon">📝</div><p>作業記録がまだありません</p></div>'
    :'<div class="timeline">'+cropLogs.map(function(l){return makeTimelineCard(l);}).join('')+'</div>';

  var html='<button class="back-btn" onclick="backFromCrop()">← 戻る</button>'
    +'<div class="crop-hero">'
    +'<div class="crop-hero-top">'
    +'<span class="crop-emoji">'+emoji+'</span>'
    +'<div style="flex:1;min-width:0">'
    +'<div class="crop-title">'+name+(crop.variety?' <span style="font-weight:400;font-size:.82rem;color:#888">('+crop.variety+')</span>':'')+' </div>'
    +(subText?'<div class="crop-sub">'+subText+'</div>':'')
    +'</div>'
    +'</div>'
    +progressHtml
    +'<div class="crop-stats">'
    +'<div class="stat"><div class="stat-n">'+cropLogs.length+'</div><div class="stat-l">作業記録</div></div>'
    +'<div class="stat"><div class="stat-n">'+(hvKg>0?hvKg.toFixed(1)+'kg':'—')+'</div><div class="stat-l">収穫量</div></div>'
    +'<div class="stat"><div class="stat-n">'+(hvCnt>0?hvCnt+'個':'—')+'</div><div class="stat-l">収穫個数</div></div>'
    +'</div>'
    +'<div class="meta-row">'
    +'<span class="view-count" id="crop-view-count">👁 …</span>'
    +'<button class="fav-btn'+(on?' on':'')+'" id="crop-fav-btn" onclick="toggleFav(\''+cropId+'\')">'+(on?'⭐ お気に入り':'☆ お気に入り')+'</button>'
    +'</div>'
    +'</div>'
    +logsHtml;

  document.getElementById('crop-main').innerHTML=html;
  document.getElementById('view-crop').style.display='';

  // ビューカウント
  fetch(SB_URL+'/rest/v1/crop_views?crop_id=eq.'+cropId+'&select=view_count',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}})
    .then(function(r){return r.json();}).then(function(data){
      var el=document.getElementById('crop-view-count');
      if(el)el.textContent='👁 '+(data&&data.length>0?data[0].view_count||1:1)+'回閲覧';
      if(data&&data.length>0){
        fetch(SB_URL+'/rest/v1/crop_views?crop_id=eq.'+cropId,{method:'PATCH',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({view_count:(data[0].view_count||0)+1,updated_at:new Date().toISOString()})});
      }else{
        fetch(SB_URL+'/rest/v1/crop_views',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({crop_id:cropId,view_count:1})});
      }
    }).catch(function(){});
}

function backFromCrop(){
  document.getElementById('view-crop').style.display='none';
  // 品種リストが開いていれば品種リストへ、なければカテゴリへ
  if(document.getElementById('view-varieties').style.display!=='none'||
     allCrops.filter(function(c){var db=CDB[c.type]||{};return(db.n||c.type)===cropName(allCrops.find(function(x){return x.id===currentCropId;})||{});}).length>1){
    document.getElementById('view-varieties').style.display='';
  } else {
    switchMode('categories');
  }
}

// 報告機能
var reportTarget={};
function openReport(logId,imgSrc){reportTarget={logId,imgSrc};document.getElementById('report-modal').classList.add('open');}
function closeReport(){document.getElementById('report-modal').classList.remove('open');}
function submitReport(){
  fetch(SB_URL+'/rest/v1/reports',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify({log_id:reportTarget.logId||null,img_src:reportTarget.imgSrc||null,reason:document.getElementById('report-reason').value+(document.getElementById('report-detail').value?': '+document.getElementById('report-detail').value:''),created_at:new Date().toISOString()})
  }).then(function(){closeReport();alert('報告を受け付けました。');}).catch(function(){alert('送信に失敗しました。');});
}

async function main(){
  var params=new URLSearchParams(location.search);
  var uidParam=params.get('uid'),slugParam=params.get('u'),cropParam=params.get('crop');

  if(!uidParam&&!slugParam){
    document.getElementById('view-categories').style.display='';
    document.getElementById('view-categories').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><p>URLが正しくありません</p></div>';
    return;
  }
  try{
    var farms=await api('public_farms',slugParam?'slug=eq.'+slugParam+'&is_public=eq.true&select=*':'user_id=eq.'+uidParam+'&is_public=eq.true&select=*');
    if(!farms||!farms.length){
      document.getElementById('view-categories').style.display='';
      document.getElementById('cat-grid').innerHTML='<div class="empty"><div class="empty-icon">🌾</div><p>農場が見つかりません</p></div>';
      return;
    }
    var farm=farms[0],farmUid=farm.user_id;
    document.title=(farm.display_name||'サクメモ')+' - サクメモ';
    document.getElementById('farm-header-wrap').innerHTML=
      '<div class="farm-header">'
      +'<h1 class="farm-title">🌾 '+(farm.display_name||'農場')+'</h1>'
      +(farm.description?'<p class="farm-desc">'+farm.description+'</p>':'')
      +'</div>';

    var res=await Promise.all([
      api('crops','user_id=eq.'+farmUid+'&is_public=eq.true&select=*&order=created_at'),
      api('logs','user_id=eq.'+farmUid+'&select=*&order=date.desc,time.desc')
    ]);
    allCrops=res[0]||[];
    allLogs=res[1]||[];

    if(!allCrops.length){
      document.getElementById('view-categories').style.display='';
      document.getElementById('cat-grid').innerHTML='<div class="empty"><div class="empty-icon">🌱</div><p>公開されている品目がありません</p></div>';
      return;
    }

    // crop パラメータがあれば直接品目詳細へ
    if(cropParam&&allCrops.find(function(c){return c.id===cropParam;})){
      showCropDetail(cropParam);
    } else {
      switchMode('categories');
    }

    // 農場ビューカウント
    api('farm_views','user_id=eq.'+farmUid+'&select=view_count').then(function(data){
      if(data&&data.length>0){
        fetch(SB_URL+'/rest/v1/farm_views?user_id=eq.'+farmUid,{method:'PATCH',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({view_count:(data[0].view_count||0)+1,updated_at:new Date().toISOString()})});
      }else{
        fetch(SB_URL+'/rest/v1/farm_views',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({user_id:farmUid,view_count:1})});
      }
    }).catch(function(){});
  }catch(e){
    console.error(e);
    document.getElementById('view-categories').style.display='';
    document.getElementById('cat-grid').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><p>読み込みに失敗しました</p></div>';
  }
}
main();
</script>
