<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Sans','BIZ UDGothic',sans-serif;background:#f8f5ef;color:#1c1a14;min-height:100svh;}
.photo-img{-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none;} #lightbox-img{-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none;pointer-events:none;}
.top-bar{background:linear-gradient(135deg,#2d6a3f,#419857);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200;}
.top-bar a{color:#fff;text-decoration:none;font-size:.84rem;font-weight:700;white-space:nowrap;}
.farm-header{max-width:680px;margin:0 auto;padding:14px 14px 6px;}
.farm-title{font-family:'Shippori Mincho B1',serif;font-size:1.3rem;margin-bottom:3px;}
.farm-desc{font-size:.78rem;color:#888;}

/* タブバー */
.tab-bar{background:#fff;border-bottom:2px solid #e0d9ce;position:sticky;top:44px;z-index:199;overflow:visible;}
.tab-bar-inner{max-width:680px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overflow-y:visible;}
.tab-bar-inner::-webkit-scrollbar{display:none;}

/* タイムラインタブ（先頭固定） */
.tab-timeline{flex-shrink:0;padding:10px 14px;border:none;background:none;font-family:inherit;font-size:.76rem;color:#888;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;}
.tab-timeline.active{color:#2d6a3f;border-bottom-color:#2d6a3f;font-weight:700;}

/* 品目タブ（ドロップダウン） */
.crop-tab-wrap{position:relative;flex-shrink:0;}
.crop-tab-btn{padding:10px 13px;border:none;background:none;font-family:inherit;font-size:.76rem;color:#888;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;display:flex;align-items:center;gap:3px;}
.crop-tab-btn.active{color:#2d6a3f;border-bottom-color:#2d6a3f;font-weight:700;}

.dropdown{display:none;position:absolute;top:100%;left:0;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);min-width:160px;z-index:300;overflow:hidden;margin-top:2px;}
.dropdown.open{display:block;}
.crop-tab-wrap:hover .dropdown{display:block;}
.crop-tab-wrap:focus-within .dropdown{display:block;}
.dropdown-item{padding:10px 14px;cursor:pointer;font-size:.82rem;display:flex;align-items:center;gap:8px;border-bottom:1px solid #f0ebe3;}
.dropdown-item:last-child{border-bottom:none;}
.dropdown-item:hover{background:#f0f9f0;}
.dropdown-item.active{color:#2d6a3f;font-weight:700;background:#f0f9f0;}

/* メインコンテンツ */
.main{max-width:680px;margin:0 auto;padding:12px 14px 60px;}

/* 品目ヒーロー */
.crop-hero{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.07);}
.crop-hero-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;}
.crop-emoji{font-size:2.2rem;}
.crop-title{font-family:'Shippori Mincho B1',serif;font-size:1rem;font-weight:700;}
.crop-sub{font-size:.72rem;color:#888;margin-top:3px;}
.crop-stats{display:flex;gap:8px;margin-top:10px;}
.stat{flex:1;background:#f8f5ef;border-radius:9px;padding:7px 4px;text-align:center;}
.stat-n{font-size:1rem;font-weight:700;color:#2d6a3f;}
.stat-l{font-size:.62rem;color:#888;margin-top:1px;}
.progress-bar{height:5px;background:#e0d9ce;border-radius:999px;margin:8px 0 3px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#2d6a3f,#52b788);border-radius:999px;}
.progress-label{display:flex;justify-content:space-between;font-size:.68rem;color:#888;}
.meta-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid #e0d9ce;}
.view-count{font-size:.7rem;color:#aaa;}
.fav-btn{background:none;border:1.5px solid #e0d9ce;border-radius:999px;padding:4px 12px;font-size:.72rem;cursor:pointer;font-family:inherit;color:#888;}
.fav-btn.on{background:#fff9f0;border-color:#f0a500;color:#f0a500;}

/* ログカード（旧スタイル） */
.log-card{background:#fff;border-radius:12px;padding:13px 14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.07);}
.log-work{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.wt{padding:2px 9px;border-radius:999px;font-size:.7rem;font-weight:700;}
.sow{background:#dcfce7;color:#166534;}
.transplant{background:#ede9fe;color:#5b21b6;}
.fert{background:#d1fae5;color:#065f46;}
.pest{background:#fef3c7;color:#92400e;}
.harvest{background:#dbeafe;color:#1e40af;}
.other{background:#f3f4f6;color:#374151;}
.log-detail{font-size:.8rem;font-weight:600;color:#1c1a14;margin-bottom:4px;}
.log-memo{font-size:.8rem;color:#5a5040;line-height:1.6;}
.hv-box{display:flex;gap:10px;margin-top:8px;background:#f0f9f4;border-radius:8px;padding:8px 10px;}
.hv-n{font-size:1rem;font-weight:700;color:#2d6a3f;}
.hv-l{font-size:.65rem;color:#888;margin-top:1px;}

/* タイムライン内のlog-card（品目タグ付き） */
.log-crop-tag{font-size:.68rem;background:#f0f9f0;color:#2d6a3f;border-radius:999px;padding:2px 8px;cursor:pointer;}

/* 写真 */
.log-photos-wrap{margin-top:8px;display:grid;gap:2px;border-radius:8px;overflow:hidden;}
.log-photos-wrap.p1 img{width:100%;max-height:240px;object-fit:cover;display:block;}
.log-photos-wrap.p2{grid-template-columns:1fr 1fr;}
.log-photos-wrap.p2 img{width:100%;height:150px;object-fit:cover;display:block;}
.log-photos-wrap.p3{grid-template-columns:1fr 1fr 1fr;}
.log-photos-wrap.p3 img{width:100%;height:120px;object-fit:cover;display:block;}
.photo-img{cursor:zoom-in;}

/* ライトボックス */
.lightbox{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:9999;align-items:center;justify-content:center;}
.lightbox.open{display:flex;}
.lightbox img{max-width:92vw;max-height:86vh;object-fit:contain;border-radius:8px;-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none;}
.lightbox-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.2);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.lightbox-prev,.lightbox-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.lightbox-prev{left:12px;}
.lightbox-next{right:12px;}

.report-btn{background:none;border:none;color:#ccc;font-size:.65rem;cursor:pointer;padding:2px 6px;border-radius:4px;font-family:inherit;margin-top:4px;}
.report-btn:hover{color:#dc2626;}
.empty{text-align:center;padding:48px 20px;color:#aaa;}
.empty-icon{font-size:2.2rem;margin-bottom:10px;}
.loading{text-align:center;padding:48px;color:#aaa;}
.report-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center;}
.report-modal.open{display:flex;}
.report-box{background:#fff;border-radius:16px;padding:24px;max-width:360px;width:90%;}
</style>
</head>

var WORK={
  sow:{l:'播種',cls:'sow'},germinated:{l:'発芽確認',cls:'sow'},
  transplant:{l:'定植',cls:'transplant'},water:{l:'水やり',cls:'other'},

  check:{l:'見回り',cls:'other'},other:{l:'その他',cls:'other'}
};

var allCrops=[],allLogs=[],currentTab='timeline',currentCropId=null;
var lbPhotos=[],lbIdx=0;

// お気に入り
function getFavs(){try{return JSON.parse(localStorage.getItem('sakumemo_crop_favs')||'[]');}catch{return[];}}
function isFav(id){return getFavs().indexOf(id)>=0;}
function toggleFav(cropId){
  var fs=getFavs(),fi=fs.indexOf(cropId);
  if(fi>=0)fs.splice(fi,1);else fs.push(cropId);
  localStorage.setItem('sakumemo_crop_favs',JSON.stringify(fs));
  var btn=document.getElementById('crop-fav-btn');
  if(btn){var on=isFav(cropId);btn.className='fav-btn'+(on?' on':'');btn.textContent=on?'⭐ お気に入り':'☆ お気に入り';}
}

function api(t,p){
  return fetch(SB_URL+'/rest/v1/'+t+'?'+p,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}}).then(function(r){return r.json();});
}
function daysSince(d){return d?Math.floor((Date.now()-new Date(d))/86400000):0;}
function fmtDate(d){if(!d)return'';var dt=new Date(d);return(dt.getMonth()+1)+'/'+dt.getDate();}
function cropName(c){var db=CDB[c.type]||{};return c.type==='custom'?(c.custom_name||'その他'):(db.n||c.type);}
function cropEmoji(c){return(CDB[c.type]||{}).e||'🌱';}

// タブ構築
function buildTabs(){
  var inner=document.getElementById('tabs-inner');

  // タイムラインタブ（先頭）
  var tlBtn=document.createElement('button');
  tlBtn.className='tab-timeline'+(currentTab==='timeline'?' active':'');
  tlBtn.textContent='📋 すべての記録';
  tlBtn.addEventListener('click',function(){selectTab('timeline');});
  inner.appendChild(tlBtn);

  // 品目タイプでグループ化
  var typeGroups={};
  allCrops.forEach(function(c){
    var db=CDB[c.type]||{};
    var key=c.type==='custom'?(c.custom_name||'その他'):(db.n||c.type);
    if(!typeGroups[key])typeGroups[key]={key:key,emoji:db.e||'🌱',crops:[]};
    typeGroups[key].crops.push(c);
  });

  Object.values(typeGroups).forEach(function(g){
    var wrap=document.createElement('div');
    wrap.className='crop-tab-wrap';

    var btn=document.createElement('button');
    btn.className='crop-tab-btn'+(currentCropId&&g.crops.some(function(c){return c.id===currentCropId;})?' active':'');
    btn.innerHTML=g.emoji+' '+g.key;
    btn.setAttribute('data-key',g.key);

    var dd=document.createElement('div');
    dd.className='dropdown';
    dd.innerHTML=g.crops.map(function(c){
      var label=c.variety?c.variety:(cropName(c)+(c.ended?'（終了）':''));
      return '<div class="dropdown-item'+(c.id===currentCropId?' active':'')+'" data-id="'+c.id+'">'
        +cropEmoji(c)+' '+label
        +(c.ended?'<span style="font-size:.62rem;color:#e67e22;margin-left:4px">終了</span>':'')
        +'</div>';
    }).join('');

    // タップ/クリックでドロップダウン
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      // 他のドロップダウンを閉じる
      document.querySelectorAll('.dropdown.open').forEach(function(d){
        if(d!==dd)d.classList.remove('open');
      });
      if(g.crops.length===1){
        // 1品目のみなら直接選択
        selectCrop(g.crops[0].id);
      } else {
        dd.classList.toggle('open');
      }
    });

    dd.addEventListener('click',function(e){
      var item=e.target.closest('.dropdown-item');
      if(item){
        selectCrop(item.dataset.id);
        dd.classList.remove('open');
      }
    });

    wrap.appendChild(btn);
    wrap.appendChild(dd);
    inner.appendChild(wrap);
  });

  // 外クリックでドロップダウン閉じる
  document.addEventListener('click',function(){
    document.querySelectorAll('.dropdown.open').forEach(function(d){d.classList.remove('open');});
  });
}

function selectTab(tab){
  currentTab=tab;
  currentCropId=null;
  // タブの active 更新
  document.querySelectorAll('.tab-timeline').forEach(function(b){
    b.className='tab-timeline'+(tab==='timeline'?' active':'');
  });
  document.querySelectorAll('.crop-tab-btn').forEach(function(b){b.className='crop-tab-btn';});
  renderTimeline();
}

function selectCrop(cropId){
  currentCropId=cropId;
  currentTab='crop';
  // タブの active 更新
  document.querySelectorAll('.tab-timeline').forEach(function(b){b.className='tab-timeline';});
  document.querySelectorAll('.crop-tab-btn').forEach(function(b){
    var key=b.getAttribute('data-key');
    var crop=allCrops.find(function(c){return c.id===cropId;});
    var db=CDB[crop&&crop.type]||{};
    var cropKey=crop&&crop.type==='custom'?(crop.custom_name||'その他'):(db.n||crop.type);
    b.className='crop-tab-btn'+(key===cropKey?' active':'');
  });
  renderCrop(cropId);
}

// ログカード生成（旧スタイル）
function makeLogCard(l,showCropTag){
  var w=WORK[l.work]||{l:l.work||'',cls:'other'};
  var detail='';
  if(l.fert_name)detail=l.fert_name+(l.fert_amt?' '+l.fert_amt+(l.fert_unit||''):'')+(l.fert_method?' · '+l.fert_method:'');
  if(l.pest_name)detail=l.pest_name+(l.pest_dil?' '+l.pest_dil+'倍':'')+(l.pest_amt?' · '+l.pest_amt+(l.pest_unit||''):'');
  if(l.transplant_qty)detail='定植 '+l.transplant_qty+'株';
  if(l.sow_qty)detail='播種 '+l.sow_qty+'粒';
  if(l.event_type)detail=l.event_type+(l.event_note?' · '+l.event_note:'');

  var hvHtml='';
  if(l.hv_kg||l.hv_cnt){
    hvHtml='<div class="hv-box">';
    if(l.hv_kg)hvHtml+='<div><div class="hv-n">'+l.hv_kg+'kg</div><div class="hv-l">収穫量</div></div>';
    if(l.hv_cnt)hvHtml+='<div><div class="hv-n">'+l.hv_cnt+'個</div><div class="hv-l">個数</div></div>';
    if(l.hv_q)hvHtml+='<div><div class="hv-n">'+l.hv_q+'</div><div class="hv-l">品質</div></div>';
    hvHtml+='</div>';
  }

  // 写真
  var photos=[l.img_src,l.img2_src,l.img3_src].filter(Boolean);
  var photoHtml='';
  if(photos.length){
    var pc='p'+Math.min(photos.length,3);
    var photosJson=JSON.stringify(photos).replace(/"/g,"'");
    var crop2=allCrops.find(function(c){return c.id===l.crop_id;});
    photoHtml='<div class="log-photos-wrap '+pc+'">'
      +photos.slice(0,3).map(function(src,i){
        if(showCropTag && crop2){
          // タイムライン: 写真タップで品目ページへ
          return '<img src="'+src+'" class="photo-img" alt="" loading="lazy" style="cursor:pointer" data-cid="'+crop2.id+'" onclick="handlePhotoClick(this)">';
        } else {
          // 品目ページ: 写真タップでライトボックス
          return '<img src="'+src+'" class="photo-img" alt="" loading="lazy" onclick="openLightbox('+photosJson+','+i+')">';
        }
      }).join('')
      +'</div>';
  }

  // 品目タグ（タイムライン時）
  var cropTagHtml='';
  if(showCropTag){
    var crop=allCrops.find(function(c){return c.id===l.crop_id;})||{};
    if(crop.type){
      var cname=cropName(crop)+(crop.variety?' ('+crop.variety+')':'');
      cropTagHtml='<span class="log-crop-tag" onclick="selectCrop(\''+crop.id+'\')">'+cropEmoji(crop)+' '+cname+'</span>';
    }
  }

  return '<div class="log-card">'
    +'<div class="log-work">'
    +'<span class="wt '+w.cls+'">'+w.l+'</span>'
    +cropTagHtml
    +'<span style="font-size:.68rem;color:#aaa;margin-left:auto">'+fmtDate(l.date)+'</span>'
    +'</div>'
    +(detail?'<div class="log-detail">'+detail+'</div>':'')
    +(l.memo?'<div class="log-memo">'+l.memo+'</div>':'')
    +hvHtml
    +photoHtml
    +(photos.length?'<button class="report-btn" onclick="openReport(\''+l.id+'\',\''+photos[0]+'\')">通報</button>':'')
    +'</div>';
}

function renderTimeline(){
  var el=document.getElementById('main');
  var logs=[...allLogs].sort(function(a,b){
    return((b.date||'')+(b.time||''))>((a.date||'')+(a.time||''))?1:-1;
  });
  if(!logs.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">📝</div><p>作業記録がまだありません</p></div>';
    return;
  }
  el.innerHTML=logs.map(function(l){return makeLogCard(l,true);}).join('');
}

function renderCrop(cropId){
  var el=document.getElementById('main');
  var crop=allCrops.find(function(c){return c.id===cropId;});
  if(!crop){el.innerHTML='<div class="empty">品目が見つかりません</div>';return;}

  var db=CDB[crop.type]||{};
  var name=cropName(crop);
  var emoji=cropEmoji(crop);
  var days=daysSince(crop.plant_date||crop.sow_date);
  var harvestD=db.d||90;
  var pct=Math.min(100,Math.round(days/harvestD*100));
  var isFruitCrop=db.fruit||false;
  var plantYear=crop.plant_date?new Date(crop.plant_date).getFullYear():null;
  var yearsSince=plantYear?new Date().getFullYear()-plantYear+1:null;

  var cropLogs=allLogs.filter(function(l){return l.crop_id===cropId;});
  cropLogs.sort(function(a,b){return((b.date||'')+(b.time||''))>((a.date||'')+(a.time||''))?1:-1;});
  var hvKg=0,hvCnt=0;
  cropLogs.forEach(function(l){hvKg+=parseFloat(l.hv_kg)||0;hvCnt+=parseInt(l.hv_cnt)||0;});

  var subText='';
  if(isFruitCrop&&yearsSince)subText='植付 '+yearsSince+'年目';
  else if(crop.plant_date)subText=(crop.cultivation_type==='direct'?'播種':'定植')+': '+crop.plant_date+' · '+days+'日目';
  else if(crop.sow_date)subText='播種: '+crop.sow_date+' · '+days+'日目';
  if(crop.ended)subText+=(subText?' · ':'')+'栽培終了'+(crop.end_date?' '+crop.end_date:'');

  var progressHtml='';
  if(!crop.ended&&(crop.plant_date||crop.sow_date)&&!isFruitCrop){
    progressHtml='<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div>'
      +'<div class="progress-label"><span>生育進捗 '+pct+'%</span><span>収穫まで約'+Math.max(0,harvestD-days)+'日</span></div>';
  }

  var on=isFav(cropId);
  var logsHtml=cropLogs.length===0
    ?'<div class="empty"><div class="empty-icon">📝</div><p>作業記録がまだありません</p></div>'
    :cropLogs.map(function(l){return makeLogCard(l,false);}).join('');

  el.innerHTML='<div class="crop-hero">'
    +'<div class="crop-hero-top">'
    +'<span class="crop-emoji">'+emoji+'</span>'
    +'<div style="flex:1;min-width:0">'
    +'<div class="crop-title">'+name+(crop.variety?' <span style="font-weight:400;font-size:.82rem;color:#888">('+crop.variety+')</span>':'')+' </div>'
    +(subText?'<div class="crop-sub">'+subText+'</div>':'')
    +'</div>'
    +'</div>'
    +progressHtml
    +'<div class="crop-stats">'
    +'<div class="stat"><div class="stat-n">'+cropLogs.length+'</div><div class="stat-l">作業記録</div></div>'
    +'<div class="stat"><div class="stat-n">'+(hvKg>0?hvKg.toFixed(1)+'kg':'—')+'</div><div class="stat-l">収穫量</div></div>'
    +'<div class="stat"><div class="stat-n">'+(hvCnt>0?hvCnt+'個':'—')+'</div><div class="stat-l">収穫個数</div></div>'
    +'</div>'
    +'<div class="meta-row">'
    +'<span class="view-count" id="crop-view-count">👁 …</span>'
    +'<button class="fav-btn'+(on?' on':'')+'" id="crop-fav-btn" onclick="toggleFav(\''+cropId+'\')">'+(on?'⭐ お気に入り':'☆ お気に入り')+'</button>'
    +'</div>'
    +'</div>'
    +logsHtml;

  // ビューカウント
  fetch(SB_URL+'/rest/v1/crop_views?crop_id=eq.'+cropId+'&select=view_count',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}})
    .then(function(r){return r.json();}).then(function(data){
      var e2=document.getElementById('crop-view-count');
      if(e2)e2.textContent='👁 '+(data&&data.length>0?data[0].view_count||1:1)+'回閲覧';
      if(data&&data.length>0){
        fetch(SB_URL+'/rest/v1/crop_views?crop_id=eq.'+cropId,{method:'PATCH',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({view_count:(data[0].view_count||0)+1,updated_at:new Date().toISOString()})});
      }else{
        fetch(SB_URL+'/rest/v1/crop_views',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({crop_id:cropId,view_count:1})});
      }
    }).catch(function(){});
}

// 写真クリックハンドラ
function handlePhotoClick(el){
  var cid = el.dataset.cid;
  if(cid) selectCrop(cid);
}

// ライトボックス
function openLightbox(photos,idx){
  lbPhotos=photos;lbIdx=idx;
  document.getElementById('lightbox-img').src=photos[idx];
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');}
function lightboxPrev(e){e.stopPropagation();lbIdx=(lbIdx-1+lbPhotos.length)%lbPhotos.length;document.getElementById('lightbox-img').src=lbPhotos[lbIdx];}
function lightboxNext(e){e.stopPropagation();lbIdx=(lbIdx+1)%lbPhotos.length;document.getElementById('lightbox-img').src=lbPhotos[lbIdx];}
// 右クリック・長押し無効
document.addEventListener('contextmenu',function(e){if(e.target.tagName==='IMG')e.preventDefault();});

// 通報
var reportTarget={};
function openReport(logId,imgSrc){reportTarget={logId:logId,imgSrc:imgSrc};document.getElementById('report-modal').classList.add('open');}
function closeReport(){document.getElementById('report-modal').classList.remove('open');}
function submitReport(){
  fetch(SB_URL+'/rest/v1/reports',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify({log_id:reportTarget.logId||null,img_src:reportTarget.imgSrc||null,reason:document.getElementById('report-reason').value+(document.getElementById('report-detail').value?': '+document.getElementById('report-detail').value:''),created_at:new Date().toISOString()})
  }).then(function(){closeReport();alert('報告を受け付けました。');}).catch(function(){alert('送信に失敗しました。');});
}

async function main(){
  var params=new URLSearchParams(location.search);
  var uidParam=params.get('uid'),slugParam=params.get('u'),cropParam=params.get('crop');
  if(!uidParam&&!slugParam){document.getElementById('main').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><p>URLが正しくありません</p></div>';return;}
  try{
    var farms=await api('public_farms',slugParam?'slug=eq.'+slugParam+'&is_public=eq.true&select=*':'user_id=eq.'+uidParam+'&is_public=eq.true&select=*');
    if(!farms||!farms.length){document.getElementById('main').innerHTML='<div class="empty"><div class="empty-icon">🌾</div><p>農場が見つかりません</p></div>';return;}
    var farm=farms[0],farmUid=farm.user_id;
    document.title=(farm.display_name||'サクメモ')+' - サクメモ';
    document.getElementById('farm-header-wrap').innerHTML=
      '<div class="farm-header"><h1 class="farm-title">🌾 '+(farm.display_name||'農場')+'</h1>'
      +(farm.description?'<p class="farm-desc">'+farm.description+'</p>':'')+'</div>';

    var res=await Promise.all([
      api('crops','user_id=eq.'+farmUid+'&is_public=eq.true&select=*&order=created_at'),
      api('logs','user_id=eq.'+farmUid+'&select=*&order=date.desc,time.desc')
    ]);
    allCrops=res[0]||[];allLogs=res[1]||[];

    if(!allCrops.length){document.getElementById('main').innerHTML='<div class="empty"><div class="empty-icon">🌱</div><p>公開されている品目がありません</p></div>';return;}

    document.getElementById('tab-bar').style.display='';
    buildTabs();

    if(cropParam&&allCrops.find(function(c){return c.id===cropParam;})){
      selectCrop(cropParam);
    } else {
      renderTimeline();
    }

    // 農場ビューカウント
    api('farm_views','user_id=eq.'+farmUid+'&select=view_count').then(function(data){
      if(data&&data.length>0){
        fetch(SB_URL+'/rest/v1/farm_views?user_id=eq.'+farmUid,{method:'PATCH',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({view_count:(data[0].view_count||0)+1,updated_at:new Date().toISOString()})});
      }else{
        fetch(SB_URL+'/rest/v1/farm_views',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({user_id:farmUid,view_count:1})});
      }
    }).catch(function(){});
  }catch(e){
    console.error(e);
    document.getElementById('main').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><p>読み込みに失敗しました</p></div>';
  }
}
main();
</script>
